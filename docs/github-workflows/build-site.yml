# Optional: copy to .github/workflows/build-site.yml to regenerate pages automatically
# whenever scripts/ or data/opportunities.json change.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/opportunities.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pages
        run: python3 scripts/build.py
      - name: Commit generated pages
        run: |
          git config user.name "winfast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' sitemap.xml _layouts
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "build: regenerate pages"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
